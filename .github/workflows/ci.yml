name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v7.0.1

      - name: Check the page
        run: |
          test -s index.html
          grep -q '<title>.*</title>' index.html
          grep -q 'Registration Number: 014' index.html

      - name: Check the stylesheet
        run: |
          test -s style.css
          grep -q 'href="style.css"' index.html || {
            echo "ERROR: index.html must link to style.css"
            exit 1
          }

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and conditionally push the image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-a2:latest